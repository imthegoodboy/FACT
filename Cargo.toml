[workspace]
resolver = "2"
members = [
    "crates/fact-cli",
    "crates/fact-client",
    "crates/fact-config",
    "crates/fact-engine",
    "crates/fact-layout",
    "crates/fact-protocol",
    "crates/fact-pty",
    "crates/fact-term",
]

[workspace.package]
version = "0.7.0"
edition = "2021"
rust-version = "1.88"
authors = ["FACT contributors"]
license = "MIT"
repository = "https://github.com/imthegoodboy/FACT"
homepage = "https://github.com/imthegoodboy/FACT"

[workspace.dependencies]
anyhow = "1.0"
arboard = { version = "3.6", default-features = false }
clap = { version = "4.6", features = ["derive", "wrap_help"] }
criterion = "0.7"
crossterm = "0.29"
ratatui = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.23"
thiserror = "2.0"
toml = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"

[profile.bench]
lto = "thin"
codegen-units = 1
