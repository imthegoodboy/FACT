[package]
name = "fact-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "FACT command line interface"

[[bin]]
name = "fact"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
fact-client = { path = "../fact-client" }
fact-config = { path = "../fact-config" }
fact-daemon = { path = "../fact-daemon" }
fact-ipc = { path = "../fact-ipc" }
fact-protocol = { path = "../fact-protocol" }
fact-pty = { path = "../fact-pty" }
fact-runtime = { path = "../fact-runtime" }
fact-session = { path = "../fact-session" }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
assert_cmd = "2"
fact-layout = { path = "../fact-layout" }
fact-term = { path = "../fact-term" }
predicates = "3"
