[package]
name = "fact-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "FACT terminal user interface"

[dependencies]
anyhow.workspace = true
arboard.workspace = true
crossterm.workspace = true
fact-config = { path = "../fact-config" }
fact-engine = { path = "../fact-engine" }
fact-layout = { path = "../fact-layout" }
fact-protocol = { path = "../fact-protocol" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp"] }
ratatui.workspace = true
unicode-width = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse"] }

[dev-dependencies]
tempfile.workspace = true
